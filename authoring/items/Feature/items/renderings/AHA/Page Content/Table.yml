  Hint: ComponentQuery
  Value: |
    query TableRows($datasource: String!, $language: String!) {
      datasource: item(path: $datasource, language: $language) {
        id
        Title: field(name: "Title"){
          ...on TextField { jsonValue }
        }
        Description: field(name: "Description") {
          ...on RichTextField { jsonValue }
        }
        
        TableRows: children(includeTemplateIDs: ["{E2D7FB37-6E73-43D9-BA38-5361EB0CF96B}"]) {
          results {
            id
            RowCells: children(includeTemplateIDs: ["{5ED597E3-3CF6-4376-A8BD-0D2D84DF282C}"]) {
              results {
                id
                Label: field(name: "Label") {
                  ... on LookupField {
                    targetItem {
                      id
                      Text: field(name: "Text") { jsonValue }
                      Icon: field(name: "Icon") { jsonValue }
                      Color: field (name: "Color") { jsonValue }
                    }
                  }
                }
                Text: field(name: "Text") {
                  ... on TextField { jsonValue }
                }
                LabelText: field(name: "Label Text") {
                  ... on TextField { jsonValue }
                }
                LabelColor: field(name: "Label Color") { jsonValue }
                LabelIcon: field(name: "Label Icon") { jsonValue }
              }
            }
          }
        }
      }
    }
    
