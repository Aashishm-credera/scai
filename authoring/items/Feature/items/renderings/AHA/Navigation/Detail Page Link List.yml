  Hint: ComponentQuery
  Value: |
    query DetailPageLinkList($datasource: String!, $language: String!) {
      datasource: item(path: $datasource, language: $language) {
        Heading: field(name: "Heading") { jsonValue }
        children(includeTemplateIDs: ["{1B182859-A89D-48C7-B772-BA32060B35C0}"]) {
          results {
            id
            PageItem: field(name: "PageItem") {
              ... on LookupField { targetItem { ...DetailPage } }
            }
            Link: field(name: "Link") { jsonValue }
            Image: field(name: "Image") { jsonValue }
            Title: field(name: "Title") { jsonValue }
            Description: field(name: "Description") { jsonValue }
            AriaLabel: field(name: "AriaLabel") { jsonValue }
          }
        }
      }
      siteSettings: item(path: "{C1A31FF3-9A48-4465-9249-924C0D44925A}", language: $language) {
        GlobalSocialFallbackImage: field(name: "GlobalSocialFallbackImage") { jsonValue }
      }
    }
    
    fragment DetailPage on Item {
      url { path }
      PageTitle: field(name: "PageTitle") { value }
      MetaDescription: field(name: "MetaDescription") { value }
      OpenGraphImage: field(name: "OpenGraphImage") { jsonValue }
    }
    
