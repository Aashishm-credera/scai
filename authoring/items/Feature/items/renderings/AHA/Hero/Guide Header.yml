  Hint: ComponentQuery
  Value: |
    query GuideHeader($datasource: String!, $contextItem: String!, $language: String!) {
      datasource: item(path: $datasource, language: $language) {
        BackgroundImage: field(name: "BackgroundImage") { jsonValue }
        FocalPointX: field(name: "FocalPointX") { jsonValue }
        FocalPointY: field(name: "FocalPointY") { jsonValue }
        Title: field(name: "Title") { jsonValue }
        Description: field(name: "Description") { jsonValue }
        StatusDate: field(name: "StatusDate") { jsonValue }
        StatusTag: field(name: "StatusTag") {
          ... on LookupField {
            targetItem {
              id
              Text: field(name: "Text") { jsonValue }
              Icon: field(name: "Icon") {
                ... on LookupField {
                  targetItem {
                    id
                    name
                    url: path
                  }
                }
              }
            }
          }
        }
      }
    
      contextItem: item(path: $contextItem, language: $language) {
        ancestors(hasLayout: true) {
          id
          name
          PageTitle: field(name: "PageTitle") { ... on TextField { value } }
          NavigationTitle: field(name: "NavigationTitle") { ... on TextField { value } }
          IsExcludedFromBreadcrumb: field(name: "ExcludeFromBreadcrumb") {
            ... on CheckboxField { value: boolValue }
          }
          url { path }
        }
      }
    }
    
